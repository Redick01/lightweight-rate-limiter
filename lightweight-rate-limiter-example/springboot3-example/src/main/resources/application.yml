server:
  port: 8113
spring:
  application:
    name: springboot3-test
  ratelimiter:
    redis-config:
      url: 127.0.0.1:6379
      password: root
      database: 0
    enable-monitor: true
    rate-limiter-configs:
      - algorithmName: token_bucket_rate_limiter
        rateLimiterKey : key1
        capacity: 1000
        rate: 200
        expressionType: spel
      - algorithmName: token_bucket_rate_limiter
        rateLimiterKey: "'/Rate/spelTest:' + #args[0].userId"
        capacity: 1000
        rate: 200
        expressionType: spel
management:
  endpoints:
    web:
      exposure:
        include: prometheus
